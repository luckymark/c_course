name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: '2.3.1-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist

      - name: Test complete C17 programs
        shell: bash -l {0}
        run: python tests/native_examples.py

      - name: Test C17 in Chromium
        shell: bash -l {0}
        run: |
          python -m pip install --group test
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --bind 127.0.0.1 --directory dist > /tmp/c-course-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python tests/browser_smoke.py http://127.0.0.1:8765

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
